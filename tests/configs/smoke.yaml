tests:
  - name: "mode smoke: ctx-rm with budget policy"
    task: CR-001
    mode: ctx-rm
    policy: budget
    budget: 1500
    max_turns: 5
    expect_pass: true

  - name: "mode smoke: minimal baseline"
    task: CR-001
    mode: minimal
    budget: 1500
    max_turns: 5
    expect_pass: true

  - name: "experiment: heuristic vs sequential"
    type: experiment
    tasks: [CR-001]
    control:
      scorer: heuristic
      policy: budget
      budget: 1500
    challenger:
      scorer: sequential
      policy: budget
      budget: 1500
    expect: "challenger_pass_rate >= control_pass_rate"
