schema_version: 1
benchmark_name: ctx-rm-context-removal-coding
description: >
  Ten concrete multi-turn benchmark tasks for evaluating context removal in
  coding agents. Each task injects needle facts or code, specifies eviction
  pressure patterns, and defines clear success criteria.

tasks:
  - id: CR-001
    title: legacy_flag_cascade
    expected_winner: full_context
    eviction_pressure: gradual_buildup
    min_turns: 20
    repo_fixture: fixtures/legacy_flag_cascade
    scenario: >
      Fix a bug in a legacy feature gate. The agent must trace a request flow
      across multiple modules and preserve an early specification about a flag.
    needles:
      - id: N1
        type: fact
        injection_turn: 3
        injection_method: doc_read
        content: "SAFE_MODE must remain true when LEGACY_AUTH is enabled."
        risk_if_evicted: "Agent flips SAFE_MODE to false and fails hidden test."
      - id: N2
        type: code
        injection_turn: 7
        injection_method: file_read
        content: "config/flags.py contains SAFE_MODE default set to True."
        risk_if_evicted: "Agent rewrites defaults without realizing dependency."
    context_injections:
      - turn: 10
        type: large_doc_dump
        size_tokens: 2500
        description: "Unrelated style guide and changelog."
    success_criteria:
      - "Bug fixed without changing SAFE_MODE default."
      - "Auth flow uses LEGACY_AUTH when enabled."
    evaluation:
      - check: file_contains
        target: src/auth/legacy.py
        must_include: "if LEGACY_AUTH:\n        token = issue_legacy_token(user)"
      - check: file_not_contains
        target: src/auth/legacy.py
        must_include: "if not LEGACY_AUTH:"
      - check: file_equals
        target: config/flags.py
        must_preserve: "SAFE_MODE = True"

  - id: CR-002
    title: migration_order_sensitivity
    expected_winner: full_context
    eviction_pressure: interleaved_noise
    min_turns: 20
    repo_fixture: fixtures/migration_order_sensitivity
    scenario: >
      Fix a failing migration by reordering steps and preserving a one-time
      data backfill mentioned early in logs.
    needles:
      - id: N1
        type: fact
        injection_turn: 4
        injection_method: log_output
        content: "Backfill MUST run before renaming column 'user_status'."
        risk_if_evicted: "Backfill runs after rename and crashes."
    context_injections:
      - turn: 6
        type: interleaved_logs
        size_tokens: 1800
        description: "Verbose migration debug logs and unrelated warnings."
    success_criteria:
      - "Migration passes without data loss."
      - "Backfill occurs before rename."
    evaluation:
      - check: file_contains_in_order
        target: migrations/0042_fix_status.py
        must_include_order:
          - "backfill_user_status"
          - "rename_column"

  - id: CR-003
    title: protocol_handshake_sequence
    expected_winner: full_context
    eviction_pressure: sudden_injection
    min_turns: 20
    repo_fixture: fixtures/protocol_handshake_sequence
    scenario: >
      Implement a client handshake. The correct sequence is given early in
      a short internal note, then a large RFC dump appears later.
    needles:
      - id: N1
        type: fact
        injection_turn: 2
        injection_method: internal_note
        content: "Handshake order: HELLO -> CHALLENGE -> RESPONSE -> READY."
        risk_if_evicted: "Agent follows RFC ordering and fails integration."
    context_injections:
      - turn: 8
        type: large_rfc_dump
        size_tokens: 4000
        description: "Full protocol RFC with alternative flow variants."
    success_criteria:
      - "Client sends messages in the internal note sequence."
      - "Integration test passes."
    evaluation:
      - check: file_contains_in_order
        target: src/client/handshake.py
        must_include_order:
          - "send_hello()"
          - "send_challenge()"
          - "send_response()"
          - "send_ready()"

  - id: CR-004
    title: log_spam_diagnosis
    expected_winner: removal
    eviction_pressure: gradual_buildup
    min_turns: 20
    repo_fixture: fixtures/log_spam_diagnosis
    scenario: >
      Identify a bug hidden in a single stack trace line after massive log spam.
    needles:
      - id: N1
        type: fact
        injection_turn: 12
        injection_method: log_output
        content: "Root cause: NoneType in cache.invalidate at cache.py:214."
        risk_if_evicted: "Agent fixes wrong module."
    context_injections:
      - turn: 4
        type: noisy_logs
        size_tokens: 5000
        description: "Repeated INFO logs and metrics output."
      - turn: 9
        type: noisy_logs
        size_tokens: 3000
        description: "Retry spam and unrelated warnings."
    success_criteria:
      - "Fix targets cache.invalidate null handling."
      - "No unrelated logging changes."
    evaluation:
      - check: file_contains
        target: src/cache/cache.py
        must_include: "if entry is None:"

  - id: CR-005
    title: generated_code_noise
    expected_winner: removal
    eviction_pressure: sudden_injection
    min_turns: 20
    repo_fixture: fixtures/generated_code_noise
    scenario: >
      Fix a bug in a small hand-written adapter while a huge generated file
      is injected into context.
    needles:
      - id: N1
        type: code
        injection_turn: 5
        injection_method: file_read
        content: "Adapter expects version_tag from metadata['ver_tag']."
        risk_if_evicted: "Agent uses metadata['version'] and fails."
    context_injections:
      - turn: 6
        type: large_generated_file
        size_tokens: 6000
        description: "Auto-generated protobuf with repeated symbols."
    success_criteria:
      - "Adapter reads metadata['ver_tag']."
      - "Generated file remains untouched."
    evaluation:
      - check: file_contains
        target: src/adapter/version_adapter.py
        must_include: "metadata['ver_tag']"

  - id: CR-006
    title: dependency_tree_shock
    expected_winner: removal
    eviction_pressure: sudden_injection
    min_turns: 20
    repo_fixture: fixtures/dependency_tree_shock
    scenario: >
      Update a dependency resolution rule. A vendor library dump appears and
      should be ignored; only a small resolver file is relevant.
    needles:
      - id: N1
        type: fact
        injection_turn: 3
        injection_method: issue_note
        content: "Resolver must prefer local overrides over transitive deps."
        risk_if_evicted: "Agent updates resolver to prefer transitive deps."
    context_injections:
      - turn: 7
        type: vendor_dump
        size_tokens: 7000
        description: "Full dependency tree and lockfile contents."
    success_criteria:
      - "Local overrides win over transitive dependencies."
    evaluation:
      - check: file_contains
        target: src/resolve/graph.py
        must_include: "if is_local_override:"

  - id: CR-007
    title: alternating_api_clients
    expected_winner: toss_up
    eviction_pressure: interleaved_noise
    min_turns: 20
    repo_fixture: fixtures/alternating_api_clients
    scenario: >
      Two similar API clients exist; the agent must patch the correct one
      based on a needle in a mid-task comment.
    needles:
      - id: N1
        type: fact
        injection_turn: 11
        injection_method: comment_read
        content: "Use ClientB for production; ClientA is test-only."
        risk_if_evicted: "Agent patches ClientA instead of ClientB."
    context_injections:
      - turn: 8
        type: interleaved_docs
        size_tokens: 2500
        description: "API docs for both clients and example usage."
    success_criteria:
      - "Change applied to ClientB only."
    evaluation:
      - check: file_contains
        target: src/clients/client_b.py
        must_include: "timeout_ms"
      - check: file_not_contains
        target: src/clients/client_a.py
        must_include: "timeout_ms"

  - id: CR-008
    title: refactor_with_outdated_comments
    expected_winner: toss_up
    eviction_pressure: gradual_buildup
    min_turns: 20
    repo_fixture: fixtures/refactor_outdated_comments
    scenario: >
      Refactor a module while ignoring outdated comments and preserving a
      hidden performance constraint given in a short benchmark note.
    needles:
      - id: N1
        type: fact
        injection_turn: 5
        injection_method: benchmark_note
        content: "Must keep O(n) memory; avoid building full list."
        risk_if_evicted: "Agent builds list and violates memory constraint."
    context_injections:
      - turn: 9
        type: outdated_comments
        size_tokens: 2000
        description: "Old design notes contradicting current code."
    success_criteria:
      - "Refactor avoids materializing full list."
    evaluation:
      - check: file_not_contains
        target: src/refactor/streaming.py
        must_include: "list("

  - id: CR-009
    title: test_harness_clue
    expected_winner: toss_up
    eviction_pressure: interleaved_noise
    min_turns: 20
    repo_fixture: fixtures/test_harness_clue
    scenario: >
      Fix a failing test; the only clue is a one-line note in a test harness
      that is easy to evict.
    needles:
      - id: N1
        type: code
        injection_turn: 13
        injection_method: file_read
        content: "Harness sets ENV=staging; code must read from ENV."
        risk_if_evicted: "Agent hardcodes production config."
    context_injections:
      - turn: 6
        type: interleaved_logs
        size_tokens: 3000
        description: "Verbose test output with flaky warnings."
    success_criteria:
      - "Config reads from ENV variable."
    evaluation:
      - check: file_contains
        target: src/config/load.py
        must_include: "os.getenv('ENV')"

  - id: CR-010
    title: multi_issue_thread
    expected_winner: toss_up
    eviction_pressure: sudden_injection
    min_turns: 20
    repo_fixture: fixtures/multi_issue_thread
    scenario: >
      Patch a bug where a long issue thread includes conflicting guidance.
      The correct fix is in a short maintainer reply.
    needles:
      - id: N1
        type: fact
        injection_turn: 4
        injection_method: issue_thread
        content: "Maintainer: prefer retry=3 with exponential backoff."
        risk_if_evicted: "Agent uses retry=5 and linear backoff."
    context_injections:
      - turn: 5
        type: long_issue_thread
        size_tokens: 5000
        description: "Contradictory suggestions and unrelated discussion."
    success_criteria:
      - "Retry count is 3 with exponential backoff."
    evaluation:
      - check: file_contains
        target: src/net/retry.py
        must_include: "retries = 3"
      - check: file_contains
        target: src/net/retry.py
        must_include: "exponential_backoff"

  - id: MULTI-001
    title: cross_file_constraint
    expected_winner: removal
    eviction_pressure: sudden_injection
    min_turns: 20
    repo_fixture: fixtures/multi_constraint_service
    scenario: >
      Apply a cross-file change: service must run on port 8443 and app startup
      must reference the config module rather than hardcoded values.
    needles:
      - id: N1
        type: fact
        injection_turn: 3
        injection_method: spec_note
        content: "Service port MUST be 8443 and app.py must import config values."
        risk_if_evicted: "Agent changes one file only or leaves hardcoded 8080."
    context_injections:
      - turn: 8
        type: unrelated_python_docs
        size_tokens: 2000
        description: "Long unrelated Python docstrings and style docs."
    success_criteria:
      - "config.yaml sets port to 8443."
      - "app.py references config values instead of hardcoded port."
    evaluation:
      - check: file_contains
        target: config/config.yaml
        must_include: "port: 8443"
      - check: file_contains
        target: src/app.py
        must_include: "from config import"

  - id: TRACE-001
    title: bug_hunt_in_log_noise
    expected_winner: removal
    eviction_pressure: sudden_injection
    min_turns: 20
    repo_fixture: fixtures/trace_bug_hunt
    scenario: >
      Investigate noisy auth failures. Implement a safe extraction path that
      handles missing user_id keys without crashing.
    needles:
      - id: N1
        type: fact
        injection_turn: 4
        injection_method: log_trace
        content: "Root cause: KeyError on 'user_id' in src/auth.py line 6."
        risk_if_evicted: "Agent patches unrelated code and leaves crash path."
    context_injections:
      - turn: 9
        type: verbose_log_noise
        size_tokens: 3000
        description: "Auth traces, retries, and red-herring stack traces."
    success_criteria:
      - "safe_extract handles missing user_id via dict.get or explicit check."
    evaluation:
      - check: file_contains
        target: src/fix.py
        must_include: "payload.get('user_id')"

  - id: SPEC-001
    title: config_synthesis_from_spec
    expected_winner: removal
    eviction_pressure: sudden_injection
    min_turns: 20
    repo_fixture: fixtures/spec_proxy_synthesis
    scenario: >
      Update nginx config based on spec: /api must proxy to localhost:3000 and
      server should terminate SSL.
    needles:
      - id: N1
        type: fact
        injection_turn: 2
        injection_method: product_spec
        content: "Must proxy /api to localhost:3000 with SSL termination on 443."
        risk_if_evicted: "Agent leaves proxy at 3001 or keeps plaintext-only listener."
    context_injections:
      - turn: 7
        type: unrelated_nginx_configs
        size_tokens: 2000
        description: "Configs for other services and old deployment notes."
    success_criteria:
      - "nginx.conf proxies /api to localhost:3000."
      - "nginx.conf includes SSL listener."
    evaluation:
      - check: file_contains
        target: nginx/nginx.conf
        must_include: "proxy_pass http://localhost:3000"
      - check: file_contains
        target: nginx/nginx.conf
        must_include: "listen 443 ssl"

  - id: SCALE-001
    title: large_codebase_navigation
    expected_winner: removal
    eviction_pressure: gradual_buildup
    min_turns: 30
    repo_fixture: fixtures/scale_codebase_nav
    scenario: >
      A web service has a bug in its authentication service. The auth module calls
      user.validate_token() but the User model only defines verify_token(). The
      correct method name is specified in the project settings. Find the bug by
      reading the config, the User model, and the auth service, then fix it.
    needles:
      - id: N1
        type: fact
        injection_turn: 3
        injection_method: config_read
        content: "TOKEN_VERIFY_METHOD = 'verify_token' -- this is the canonical method name."
        risk_if_evicted: "Agent might guess a method name or use validate_token."
      - id: N2
        type: code
        injection_turn: 5
        injection_method: file_read
        content: "User model defines verify_token(self, token) -> bool at line 87."
        risk_if_evicted: "Agent doesn't know the exact method signature."
    context_injections:
      - turn: 4
        type: large_util_dump
        size_tokens: 5000
        description: "Utility helper functions and verbose docstrings."
      - turn: 8
        type: test_output_dump
        size_tokens: 8000
        description: "Full test suite output with stack traces."
      - turn: 12
        type: middleware_docs
        size_tokens: 4000
        description: "Middleware documentation and config examples."
    success_criteria:
      - "auth.py calls user.verify_token() instead of user.validate_token()"
      - "No other files broken by the fix"
    evaluation:
      - check: file_contains
        target: src/services/auth.py
        must_include: "verify_token"
      - check: file_not_contains
        target: src/services/auth.py
        must_include: "validate_token"

  - id: SCALE-002
    title: multi_step_refactoring
    expected_winner: removal
    eviction_pressure: gradual_buildup
    min_turns: 30
    repo_fixture: fixtures/scale_multi_refactor
    scenario: >
      Rename the DataProcessor class to StreamProcessor across the entire codebase.
      A migration note specifies that the process_batch method must also be renamed
      to stream_batch as part of the new API contract. Update all imports, references,
      and method calls in every file.
    needles:
      - id: N1
        type: fact
        injection_turn: 2
        injection_method: migration_note
        content: "CRITICAL: When renaming DataProcessor, also rename process_batch to stream_batch per new API contract."
        risk_if_evicted: "Agent renames class but leaves old method name, breaking API."
    context_injections:
      - turn: 5
        type: architecture_docs
        size_tokens: 8000
        description: "Detailed architecture documentation with diagrams."
      - turn: 10
        type: ci_config_dump
        size_tokens: 6000
        description: "CI/CD pipeline configs and deployment scripts."
      - turn: 15
        type: readme_and_changelog
        size_tokens: 6000
        description: "Full README and changelog history."
      - turn: 20
        type: test_output
        size_tokens: 5000
        description: "Test runner output with timing data."
    success_criteria:
      - "DataProcessor renamed to StreamProcessor everywhere"
      - "process_batch renamed to stream_batch everywhere"
      - "No references to old names remain"
    evaluation:
      - check: file_not_contains
        target: src/core/data_processor.py
        must_include: "class DataProcessor"
      - check: file_contains
        target: src/core/data_processor.py
        must_include: "class StreamProcessor"
      - check: file_not_contains
        target: src/core/data_processor.py
        must_include: "def process_batch"
      - check: file_contains
        target: src/core/data_processor.py
        must_include: "def stream_batch"
      - check: file_not_contains
        target: src/core/pipeline.py
        must_include: "DataProcessor"
      - check: file_contains
        target: src/core/pipeline.py
        must_include: "StreamProcessor"
      - check: file_not_contains
        target: src/handlers/input_handler.py
        must_include: "DataProcessor"
      - check: file_contains
        target: src/handlers/input_handler.py
        must_include: "StreamProcessor"

  - id: SCALE-003
    title: information_synthesis
    expected_winner: removal
    eviction_pressure: sustained_pressure
    min_turns: 30
    repo_fixture: fixtures/scale_info_synthesis
    scenario: >
      Read 10 quarterly and departmental reports, extract one critical metric from
      each, and write a complete executive summary in output/summary.txt. The template
      in templates/executive_summary.txt shows the required format. Every metric must
      be present and accurate.
    needles:
      - id: N1
        type: fact
        injection_turn: 2
        injection_method: report_read
        content: "Q1 revenue was $4.2M"
        risk_if_evicted: "Agent guesses or omits Q1 revenue."
      - id: N2
        type: fact
        injection_turn: 4
        injection_method: report_read
        content: "Q2 revenue was $5.1M"
        risk_if_evicted: "Agent guesses or omits Q2 revenue."
      - id: N3
        type: fact
        injection_turn: 6
        injection_method: report_read
        content: "Q3 revenue was $3.8M"
        risk_if_evicted: "Agent guesses or omits Q3 revenue."
      - id: N4
        type: fact
        injection_turn: 8
        injection_method: report_read
        content: "Q4 revenue was $6.7M"
        risk_if_evicted: "Agent guesses or omits Q4 revenue."
      - id: N5
        type: fact
        injection_turn: 10
        injection_method: report_read
        content: "Total inventory: 142,500 units"
        risk_if_evicted: "Agent omits inventory count."
      - id: N6
        type: fact
        injection_turn: 12
        injection_method: report_read
        content: "Average shipping time: 3.2 days"
        risk_if_evicted: "Agent omits shipping metric."
      - id: N7
        type: fact
        injection_turn: 14
        injection_method: report_read
        content: "Return rate: 4.7%"
        risk_if_evicted: "Agent omits return rate."
      - id: N8
        type: fact
        injection_turn: 16
        injection_method: report_read
        content: "Marketing spend: $890K"
        risk_if_evicted: "Agent omits marketing spend."
      - id: N9
        type: fact
        injection_turn: 18
        injection_method: report_read
        content: "Headcount: 247 employees"
        risk_if_evicted: "Agent omits headcount."
      - id: N10
        type: fact
        injection_turn: 20
        injection_method: report_read
        content: "Net profit margin: 12.3%"
        risk_if_evicted: "Agent omits profit margin."
    context_injections:
      - turn: 3
        type: verbose_report_prose
        size_tokens: 6000
        description: "Quarterly narrative with market analysis."
      - turn: 7
        type: verbose_report_prose
        size_tokens: 6000
        description: "Supply chain analysis and logistics data."
      - turn: 11
        type: verbose_report_prose
        size_tokens: 6000
        description: "Customer satisfaction surveys and NPS data."
      - turn: 15
        type: verbose_report_prose
        size_tokens: 6000
        description: "Competitive analysis and market positioning."
      - turn: 19
        type: verbose_report_prose
        size_tokens: 6000
        description: "Annual planning outlook and forecasts."
      - turn: 22
        type: verbose_report_prose
        size_tokens: 5000
        description: "HR policies and benefits documentation."
    success_criteria:
      - "output/summary.txt contains all 10 metrics"
      - "All numbers are accurate (not hallucinated)"
    evaluation:
      - check: file_contains
        target: output/summary.txt
        must_include: "4.2M"
      - check: file_contains
        target: output/summary.txt
        must_include: "5.1M"
      - check: file_contains
        target: output/summary.txt
        must_include: "3.8M"
      - check: file_contains
        target: output/summary.txt
        must_include: "6.7M"
      - check: file_contains
        target: output/summary.txt
        must_include: "142,500"
      - check: file_contains
        target: output/summary.txt
        must_include: "3.2"
      - check: file_contains
        target: output/summary.txt
        must_include: "4.7%"
      - check: file_contains
        target: output/summary.txt
        must_include: "890K"
      - check: file_contains
        target: output/summary.txt
        must_include: "247"
      - check: file_contains
        target: output/summary.txt
        must_include: "12.3%"
