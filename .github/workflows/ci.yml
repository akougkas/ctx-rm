name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff
        run: |
          uv run ruff check \
            src/ctx_rm/config.py \
            src/ctx_rm/core/bus.py \
            src/ctx_rm/drivers/llamacpp.py \
            src/ctx_rm/agents/loop.py \
            src/ctx_rm/benchmarks/runner.py \
            src/ctx_rm/cli/main.py

      - name: MyPy (core paths)
        run: |
          uv run mypy --config-file=/dev/null --follow-imports=skip --ignore-missing-imports \
            src/ctx_rm/config.py \
            src/ctx_rm/core/bus.py \
            src/ctx_rm/drivers/llamacpp.py \
            src/ctx_rm/agents/loop.py \
            src/ctx_rm/benchmarks/runner.py \
            src/ctx_rm/cli/main.py

      - name: Pytest with coverage gate
        run: |
          uv run pytest \
            --cov=ctx_rm \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90
