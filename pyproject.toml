[project]
name = "ctx-rm"
version = "0.1.0"
description = "Context Removal for LLM agents — background eviction with recoverable memory"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Anthony Kougkas" },
]
keywords = ["llm", "context-management", "ai-agents", "context-window", "eviction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
    "structlog>=24.4",
    "orjson>=3.10",
    "anyio>=4.8",
    "numpy>=2.2",
]

[project.optional-dependencies]
gemini = [
    "google-genai>=1.0",
]
claude = [
    # Claude Code is installed separately via npm
    # This group provides helpers for parsing its JSON output
]
bench = [
    "matplotlib>=3.10",
    "pandas>=2.2",
    "tabulate>=0.9",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
]
embeddings = [
    "sentence-transformers>=5.0",
]
ollama = [
    "ollama>=0.6",
]
tokenizer = [
    "tiktoken>=0.8",
]
all = ["ctx-rm[gemini,bench,dev,embeddings,ollama,tokenizer]"]

[project.scripts]
ctx-rm = "ctx_rm.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctx_rm"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires real llama-server on mini:8080",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
